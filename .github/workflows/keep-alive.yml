name: Keep Render Backend Awake

on:
  schedule:
    # Run every 12 minutes to prevent Render free-tier idle spin down (15 min limit)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping KalaStyle Render Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging KalaStyle backend on Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://style-heaven-backend.onrender.com/health" || echo "failed")
          echo "Render Backend Response Code: $HTTP_STATUS"
