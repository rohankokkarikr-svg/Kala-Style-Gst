# ==============================================================================
# DEPRECATED / NON-PRODUCTION DEPLOYMENT CONFIGURATION
# ------------------------------------------------------------------------------
# The canonical production frontend for KalaStyle AI is deployed on Render:
#   https://kala-style-frontend.onrender.com
# Netlify is deprecated and preserved strictly for legacy preview/reference.
# All production users, Google OAuth, and API integrations use Render.
# ==============================================================================

[build]
  base = "frontend"
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"
  # Environment variables (REACT_APP_SUPABASE_URL, REACT_APP_SUPABASE_ANON_KEY,
  # REACT_APP_LOCATIONIQ_API_KEY, REACT_APP_API_URL, REACT_APP_RAZORPAY_KEY_ID)
  # should be configured securely in the Netlify Site settings / Environment dashboard.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
