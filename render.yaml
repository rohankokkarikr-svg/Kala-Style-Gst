services:
  # Backend API Web Service
  - type: web
    name: style-heaven-backend
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://fwuhlhaadhhveuljsqbh.supabase.co
      - key: CLOUDINARY_CLOUD_NAME
        value: dcmmxmikz
      - key: CLOUDINARY_API_KEY
        value: "149393542854794"
      - key: TWILIO_WHATSAPP_FROM
        value: "+14155238886"
      - key: RAZORPAY_KEY_ID
        value: rzp_live_TgKmH9jZyyQY6M
      - key: RAZORPAY_KEY_SECRET
        value: 2KT4MT3WvfuaX3eeYpUkUlkI
      # Shiprocket Production Logistics Configuration
      - key: SHIPPING_PROVIDER
        value: shiprocket
      - key: SHIPROCKET_API_URL
        value: https://apiv2.shiprocket.in/v1/external
      - key: SHIPROCKET_DEFAULT_PICKUP_LOCATION
        value: Home
      # Secure and sensitive variables. sync: false means you manage them in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

  # Frontend Static Site
  - type: web
    name: style-heaven-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_SUPABASE_URL
        value: https://fwuhlhaadhhveuljsqbh.supabase.co
      - key: REACT_APP_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3dWhsaGFhZGhodmV1bGpzcWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODkzODYsImV4cCI6MjEwNDM2NTM4Nn0.1sz1xgfYWGv0Ad6kCZ6KgAcYGJZG2eX0sn3o91nNlJ8
      - key: REACT_APP_LOCATIONIQ_API_KEY
        value: pk.f2bad577bd835e11c81ffd571d5c353b
      - key: CI
        value: "false"
      # Razorpay public key for checkout — must match RAZORPAY_KEY_ID in backend envVars above
      - key: REACT_APP_RAZORPAY_KEY_ID
        value: rzp_live_TgKmH9jZyyQY6M
      # Managed in the dashboard so you can customize the backend URL if name changes
      - key: REACT_APP_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
