services:
  # Backend API Web Service
  - type: web
    name: kala-style-gst-1
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: "+14155238886"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Shiprocket Production Logistics Configuration
      - key: SHIPPING_PROVIDER
        value: shiprocket
      - key: SHIPROCKET_API_URL
        value: https://apiv2.shiprocket.in/v1/external
      - key: SHIPROCKET_DEFAULT_PICKUP_LOCATION
        value: Home
      # Secure and sensitive variables. sync: false means you manage them in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

  # Frontend Static Site
  - type: web
    name: kala-style-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_SUPABASE_URL
        sync: false
      - key: REACT_APP_SUPABASE_ANON_KEY
        sync: false
      - key: REACT_APP_LOCATIONIQ_API_KEY
        sync: false
      - key: CI
        value: "false"
      # Razorpay public key for checkout — managed in dashboard
      - key: REACT_APP_RAZORPAY_KEY_ID
        sync: false
      # Managed in the dashboard so you can customize the backend URL if name changes
      - key: REACT_APP_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
